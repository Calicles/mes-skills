# Vérifie les manifest.json et fabrique les paquets de l'addon (src/outils/construire_paquets.py).
# - Pull request : vérification (versions montées si un pack a changé) + paquets en artefact du run.
# - Push sur main : publication d'une release « addon-vX.Y.Z » avec le .mcaddon et les deux .mcpack,
#   que le script de déploiement sur le Realm (scripts/realm.ps1) récupère.
name: Addon

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paquets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier et fabriquer (pull request)
        if: github.event_name == 'pull_request'
        run: python3 src/outils/construire_paquets.py --reference "origin/${{ github.base_ref }}"

      - name: Vérifier et fabriquer
        if: github.event_name != 'pull_request'
        run: python3 src/outils/construire_paquets.py

      - uses: actions/upload-artifact@v4
        with:
          name: paquets-addon
          path: build/

      - name: Publier la release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print('.'.join(map(str, json.load(open('src/aventure_BP/manifest.json', encoding='utf-8-sig'))['header']['version'])))")
          tag="addon-v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::warning::La release $tag existe déjà : version de l'addon non augmentée, rien n'est publié."
            exit 0
          fi
          gh release create "$tag" build/* \
            --target "$GITHUB_SHA" \
            --title "Le Domaine oublié $version" \
            --notes "Addon construit depuis main ($GITHUB_SHA). À déployer sur le Realm avec scripts/realm.ps1." \
            --latest
